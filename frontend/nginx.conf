server {
    listen 80;
    root /usr/share/nginx/html;

    # The dashboard calls /api/... on its own origin; nginx forwards it to the status-service.
    location /api/ {
        proxy_pass http://status-service:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
